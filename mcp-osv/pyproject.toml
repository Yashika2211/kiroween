[project]
name = "mcp-osv"
version = "0.1.0"
description = "MCP server exposing OSV vulnerability lookups for Python packages."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yashika Bhatia" }]
requires-python = ">=3.12"
dependencies = ["mcp>=1.2", "httpx>=0.27", "packaging>=24.1"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
mcp-osv = "mcp_osv.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_osv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
