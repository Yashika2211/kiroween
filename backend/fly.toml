# Fly.io Machine for the Necromancer API. A Fly Machine is a full VM, so the image runs its
# own Docker daemon for the sandboxes (see Dockerfile.fly and deploy/start.sh).
app = "necromancer-kiroween"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  NECRO_SANDBOX_MODE = "docker"
  NECRO_MAX_LINES = "5000"
  NECRO_RATE_LIMIT_PER_HOUR = "20"
  NECRO_WORKSPACE_TTL_HOURS = "24"
  NECRO_CORS_ORIGINS = "https://necromancer-iota.vercel.app,https://necromancer-yashika2211s-projects.vercel.app,http://localhost:3000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"

[mounts]
  source = "necro_data"
  destination = "/data"
  initial_size = "10gb"
