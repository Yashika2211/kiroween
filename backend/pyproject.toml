[project]
name = "necromancer"
version = "0.1.0"
description = "Resurrects abandoned open-source Python repositories."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yashika Bhatia" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "sse-starlette>=3.7.0",
  "packaging>=24.1",
  "fissix>=24.4.24",
  "pyupgrade>=3.17",
  "anthropic>=0.40",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "hypothesis>=6.112",
  "ruff>=0.6",
]

[project.scripts]
necromancer = "necromancer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["necromancer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".*", "*.egg", "build", "dist", "node_modules", "venv"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["docker: needs a running Docker daemon", "network: hits the real internet"]
addopts = "-m 'not docker and not network'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "S603", "S607", "RUF001", "ASYNC109", "ASYNC240", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "ASYNC221"]
# /tmp paths here are tmpfs mounts inside the sandbox container, not on the host.
"necromancer/sandbox/**" = ["S108"]
# Markdown templates: long prose lines are clearer unwrapped.
"necromancer/ritual/planner.py" = ["E501"]
"necromancer/rise/pr_body.py" = ["E501"]
